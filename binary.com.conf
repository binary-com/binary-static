map $http_cf_ipcountry $redirected_path {
    IT binary.com/move-to-deriv;
    DE binary.com/move-to-deriv;
    FR binary.com/move-to-deriv;
    LU binary.com/move-to-deriv;
    GR binary.com/move-to-deriv;
    ES binary.com/move-to-deriv;
    SK binary.com/move-to-deriv;
    LT binary.com/move-to-deriv;
    NL binary.com/move-to-deriv;
    AT binary.com/move-to-deriv;
    BG binary.com/move-to-deriv;
    SI binary.com/move-to-deriv;
    CY binary.com/move-to-deriv;
    BE binary.com/move-to-deriv;
    RO binary.com/move-to-deriv;
    HR binary.com/move-to-deriv;
    PT binary.com/move-to-deriv;
    PL binary.com/move-to-deriv;
    LV binary.com/move-to-deriv;
    EE binary.com/move-to-deriv;
    CZ binary.com/move-to-deriv;
    FI binary.com/move-to-deriv;
    HU binary.com/move-to-deriv;
    DK binary.com/move-to-deriv;
    SE binary.com/move-to-deriv;
    IE binary.com/move-to-deriv;
    GB binary.com/move-to-deriv;
    MT binary.com/move-to-deriv;  
}

server {
    listen 80;
    server_name  _;

    if ($http_cf_ipcountry) {
        return 301 https://$redirected_path;
    }

    add_header Cache-Control "public, max-age=7200, s-maxage=600, must-revalidate";
    charset UTF-8;

    error_page 404 /404.html;

    location @custom_error_503 {
        return 503;
    }

    location ~ /\.git {
        return 404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }
}
