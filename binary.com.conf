map $http_cf_ipcountry $redirected_domain {
  BE deriv.com;
  BG deriv.com;
  CZ deriv.com;
  DK deriv.com;
  DE deriv.com;
  EE deriv.com;
  IE deriv.com;
  EL deriv.com;
  ES deriv.com;
  FR deriv.com;
  HR deriv.com;
  IT deriv.com;
  CY deriv.com;
  LV deriv.com;
  LT deriv.com;
  LU deriv.com;
  HU deriv.com;
  MT deriv.com;
  NL deriv.com;
  AT deriv.com;
  PL deriv.com;
  PT deriv.com;
  RO deriv.com;
  SI deriv.com;
  SK deriv.com;
  FI deriv.com;
  SE deriv.com;
}

server {
    listen 80;
    server_name  _;

    if ($http_cf_ipcountry) {
        return 301 https://$redirected_domain$request_uri;
    }

    add_header Cache-Control "public, max-age=7200, s-maxage=600, must-revalidate";
    charset UTF-8;

    error_page 404 /404.html;

    location @custom_error_503 {
        return 503;
    }

    location ~ /\.git {
        return 404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }
}
