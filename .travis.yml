sudo: false
language: node_js
matrix:
    fast_finish: true
node_js:
    - node
notifications:
    email: false
before_install: npm install -g grunt-cli
install: npm install
before_script:
   - gem install travis
script:
   - curl -LO https://raw.github.com/bijan2007/binary-static/master/trigger.sh
   - chmod +x trigger.sh
   - https://raw.github.com/bijan2007/binary-static/master/get-build-status.sh
   - chmod +x get-build-status.sh
   - ./trigger.sh binary-com binary-static-ci master $TRAVIS_ACCESS_TOKEN
   - ./get-build-status.sh binary-com binary-static-ci $TRAVIS_ACCESS_TOKEN
